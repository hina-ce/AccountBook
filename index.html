<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1514" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>支出記録</title>
    <meta
      name="description"
      content="外出先の支出を素早く記録し、記録内容をメール作成できる iPhone Safari 向け PWA。"
    />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel entry-panel" aria-label="入力">
        <form id="entry-form" class="entry-form" novalidate>
          <label class="field">
            <span class="field-label">金額</span>
            <input
              id="amount-input"
              name="amount"
              class="field-input field-input-large"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              enterkeyhint="done"
              maxlength="6"
              required
            />
          </label>

          <fieldset class="field category-field">
            <legend class="field-label">カテゴリ</legend>
            <div id="category-list" class="category-grid" role="radiogroup" aria-label="カテゴリ">
              <button type="button" class="category-chip" data-category="食費">食費</button>
              <button type="button" class="category-chip" data-category="外食費">外食費</button>
              <button type="button" class="category-chip" data-category="交際費">交際費</button>
              <button type="button" class="category-chip" data-category="娯楽費">娯楽費</button>
              <button type="button" class="category-chip" data-category="医療費">医療費</button>
              <button type="button" class="category-chip" data-category="雑費">雑費</button>
            </div>
          </fieldset>

          <label class="field">
            <span class="field-label">メモ</span>
            <input
              id="memo-input"
              name="memo"
              class="field-input"
              type="text"
              maxlength="32"
              autocomplete="off"
              enterkeyhint="done"
              placeholder="任意"
            />
          </label>

          <div id="memo-preset-list" class="memo-preset-grid" aria-label="メモ定型">
            <button type="button" class="memo-preset-button" data-preset-index="0">万代</button>
            <button type="button" class="memo-preset-button" data-preset-index="1">イオン</button>
            <button type="button" class="memo-preset-button" data-preset-index="2">ファミマ</button>
          </div>

          <p id="entry-feedback" class="feedback" role="status" aria-live="polite"></p>

          <div class="action-row">
            <button id="save-button" class="primary-button" type="submit">保存</button>
            <button id="cancel-edit-button" class="secondary-button" type="button" hidden>
              新規に戻す
            </button>
          </div>
        </form>
      </section>

      <section class="panel email-panel" aria-label="メール設定">
        <div class="panel-heading">
          <p class="section-label">メール設定</p>
        </div>

        <label class="field">
          <span class="field-label">宛先メールアドレス</span>
          <input
            id="email-input"
            name="email"
            class="field-input"
            type="email"
            inputmode="email"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="name@example.com"
          />
        </label>

        <p id="email-feedback" class="feedback" role="status" aria-live="polite"></p>
      </section>

      <section class="panel list-panel" aria-label="履歴">
        <div class="panel-heading">
          <p class="section-label">履歴</p>
          <p id="total-count-label" class="mode-badge">全体 0 件</p>
        </div>

        <ul id="records-list" class="records-list" aria-live="polite"></ul>
        <p id="records-empty" class="empty-state" hidden>記録はまだありません。</p>

        <section id="monthly-summary" class="monthly-summary" aria-label="月次集計" hidden>
          <div class="monthly-summary-header">
            <p class="section-label">月次集計</p>
          </div>

          <div class="monthly-summary-table-wrap">
            <table class="monthly-summary-table">
              <thead>
                <tr>
                  <th scope="col">費目</th>
                  <th id="current-month-label" scope="col">今月</th>
                  <th id="previous-month-label" scope="col">前月</th>
                </tr>
              </thead>
              <tbody id="monthly-summary-body"></tbody>
            </table>
          </div>
        </section>

        <section class="memo-preset-settings" aria-label="メモボタン設定">
          <div class="memo-preset-settings-header">
            <p class="section-label">メモボタン設定</p>
          </div>

          <form id="memo-preset-settings-form" class="memo-preset-settings-form" novalidate>
            <div class="memo-preset-settings-list">
              <label class="field">
                <span class="field-label">ボタン1</span>
                <input class="field-input memo-preset-name-input" type="text" maxlength="32" autocomplete="off" data-preset-index="0" />
              </label>
              <label class="field">
                <span class="field-label">ボタン2</span>
                <input class="field-input memo-preset-name-input" type="text" maxlength="32" autocomplete="off" data-preset-index="1" />
              </label>
              <label class="field">
                <span class="field-label">ボタン3</span>
                <input class="field-input memo-preset-name-input" type="text" maxlength="32" autocomplete="off" data-preset-index="2" />
              </label>
            </div>

            <p id="memo-preset-settings-feedback" class="feedback" role="status" aria-live="polite"></p>
            <button class="secondary-button memo-preset-save-button" type="submit">ボタン名を保存</button>
          </form>
        </section>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
